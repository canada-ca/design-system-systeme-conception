# Repository variables: vars.PREVIEW_HOST_REPO
# Repository secrets: secrets.PUBLISH_APP_ID, secrets.PUBLISH_APP_PRIVATE_KEY (also uses the automatic GITHUB_TOKEN)

# AUTHORITATIVE cleanup mechanism for PR previews; preview-cleanup.yml is a best-effort fast path backstopped by this scheduled sweep.
name: Scheduled PR preview cleanup

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    name: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: List open pull requests
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          open_prs="$(gh api --method GET "repos/${{ github.repository }}/pulls" --paginate -f state=open --jq '.[].number' | paste -sd, -)"
          echo "OPEN_PRS=${open_prs}" >> "$GITHUB_ENV"

      - name: Read preview host repository
        id: preview_repo
        shell: bash
        env:
          PREVIEW_HOST_REPO: ${{ vars.PREVIEW_HOST_REPO }}
        run: |
          set -euo pipefail
          source .github/scripts/parse_target.sh
          parse_preview_target "${PREVIEW_HOST_REPO}"
          printf 'owner=%s\nrepository=%s\nslug=%s\nen_dir=%s\nfr_dir=%s\n' \
            "${TARGET_REPO%%/*}" "${TARGET_REPO#*/}" "$TARGET_REPO" "$EN_DIR" "$FR_DIR" >> "$GITHUB_OUTPUT"

      - name: Mint preview host token
        id: preview-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: "${{ secrets.PUBLISH_APP_ID }}"
          private-key: "${{ secrets.PUBLISH_APP_PRIVATE_KEY }}"
          owner: ${{ steps.preview_repo.outputs.owner }}
          repositories: ${{ steps.preview_repo.outputs.repository }}

      - name: Check out preview host
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.preview_repo.outputs.slug }}
          ref: main
          token: "${{ steps.preview-token.outputs.token }}"
          path: preview-host
          persist-credentials: true

      - name: Reconcile stale preview directories
        env:
          EN_DIR: ${{ steps.preview_repo.outputs.en_dir }}
          FR_DIR: ${{ steps.preview_repo.outputs.fr_dir }}
        run: |
          source .github/scripts/parse_target.sh
          for dir in "$EN_DIR" "$FR_DIR"; do
            check_checkout_path preview-host "$dir/pr-preview"
            check_checkout_path preview-host "$dir/prod-artifact"
          done
          python3 .github/scripts/scheduled_cleanup.py --preview-host preview-host \
            --en-dir="$EN_DIR" --fr-dir="$FR_DIR" --open-prs "$OPEN_PRS"

      - name: Commit and push cleanup
        working-directory: preview-host
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Sweep stale PR preview directories"
            git push origin main
          else
            echo "No stale preview host paths found."
          fi
