# Repository variables: vars.PREVIEW_HOST_REPO
# Repository secrets: secrets.PUBLISH_APP_ID, secrets.PUBLISH_APP_PRIVATE_KEY

name: Clean up PR preview

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  cleanup:
    name: cleanup
    if: "${{ startsWith(github.head_ref, 'content/') || startsWith(github.head_ref, 'hotfix/') || startsWith(github.head_ref, 'feat/') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out trusted base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Read preview host repository
        id: preview_repo
        shell: bash
        env:
          PREVIEW_HOST_REPO: ${{ vars.PREVIEW_HOST_REPO }}
        run: |
          set -euo pipefail
          source .github/scripts/parse_target.sh
          parse_preview_target "${PREVIEW_HOST_REPO}"
          printf 'owner=%s\nrepository=%s\nslug=%s\nen_dir=%s\nfr_dir=%s\n' \
            "${TARGET_REPO%%/*}" "${TARGET_REPO#*/}" "$TARGET_REPO" "$EN_DIR" "$FR_DIR" >> "$GITHUB_OUTPUT"

      - name: Mint preview host token
        id: preview-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: "${{ secrets.PUBLISH_APP_ID }}"
          private-key: "${{ secrets.PUBLISH_APP_PRIVATE_KEY }}"
          owner: ${{ steps.preview_repo.outputs.owner }}
          repositories: ${{ steps.preview_repo.outputs.repository }}

      - name: Check out preview host
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.preview_repo.outputs.slug }}
          ref: main
          token: "${{ steps.preview-token.outputs.token }}"
          path: preview-host
          persist-credentials: true

      - name: Delete preview and production-config paths
        env:
          EN_DIR: ${{ steps.preview_repo.outputs.en_dir }}
          FR_DIR: ${{ steps.preview_repo.outputs.fr_dir }}
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          source .github/scripts/parse_target.sh
          paths=(
            "${EN_DIR}/pr-preview/pr-${PR_NUMBER}"
            "${FR_DIR}/pr-preview/pr-${PR_NUMBER}"
            "${EN_DIR}/prod-artifact/pr-${PR_NUMBER}"
            "${FR_DIR}/prod-artifact/pr-${PR_NUMBER}"
          )
          for path in "${paths[@]}"; do
            check_checkout_path preview-host "$path"
          done
          for path in "${paths[@]}"; do
            rm -rf -- "preview-host/$path"
          done

      - name: Commit and push cleanup
        working-directory: preview-host
        env:
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Clean up PR ${PR_NUMBER} preview"
            git push origin main
          else
            echo "No preview host paths exist for PR ${PR_NUMBER}."
          fi
